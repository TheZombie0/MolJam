[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moljam"
version = "0.1.0"
description = "Molecular database quality scoring and visualization toolkit"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.20",
  "pandas>=1.5",
]

[project.optional-dependencies]
scoring = [
  "scipy>=1.10",
]
viz = [
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "pyecharts>=2.0",
  "snapshot-selenium>=0.0.2",
]
ml = [
  "scikit-learn>=1.2",
]
mcp = [
  "mcp>=1.0",
]
dev = [
  "pytest>=7.0",
]

[project.scripts]
moljam-mcp = "moljam.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

